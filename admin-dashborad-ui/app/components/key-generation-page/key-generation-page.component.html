<!-- Background Decorative Blobs -->
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
  <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] animate-blob"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-generator-pink/10 rounded-full blur-[100px] animate-blob" style="animation-delay: 2s"></div>
  <div class="absolute top-[40%] left-[20%] w-[300px] h-[300px] bg-secondary/10 rounded-full blur-[80px] animate-blob" style="animation-delay: 4s"></div>
</div>

<!-- Sidebar -->
<app-sidebar [isOpen]="sidebarOpen" (toggleSidebar)="handleToggleSidebar()"></app-sidebar>

<div class="main-layout" [class.sidebar-open]="sidebarOpen">
  <!-- TOP BAR -->
  <header class="bg-gradient-to-r from-header-start via-header-mid to-header-end flex justify-between items-center px-container-padding w-full z-40 backdrop-blur-md bg-white/10 shadow-md h-toolbar-height flex-shrink-0">
    <div class="flex flex-col">
      <h1 class="text-headline-lg font-headline-lg font-black text-on-primary tracking-tight">Key Management Control Room</h1>
      <p class="text-body-md font-body-md text-on-primary/70 -mt-1">Provision client licenses and monitor connections</p>
    </div>
    <div class="flex items-center gap-4">
      <button class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white/10 text-on-primary font-nav-tab hover:bg-white/20 transition-all active:scale-95 border border-white/20 cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">settings</span>
      </button>
      <button (click)="handleLogout()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white text-primary font-nav-tab font-bold hover:bg-surface-bright transition-all active:scale-95 shadow-sm cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">logout</span>
        Logout
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 overflow-hidden flex flex-col p-container-padding gap-6 min-h-0 bg-transparent">
    <!-- Tab Switcher -->
    <div class="flex justify-center flex-shrink-0">
      <div class="inline-flex p-1.5 bg-surface-container-high rounded-full shadow-inner border border-outline-variant/20">
        <button
          (click)="setActiveTab('generate')"
          class="flex items-center gap-2 px-6 py-2.5 rounded-full font-nav-tab transition-all transform cursor-pointer"
          [ngClass]="activeTab === 'generate' 
            ? 'bg-gradient-to-r from-generator-purple to-generator-pink text-white active-tab-glow hover:scale-103' 
            : 'text-on-surface-variant hover:text-primary'"
        >
          <span class="material-symbols-outlined text-[18px]">add_circle</span>
          GENERATE ACCESS KEY
        </button>
        <button
          (click)="setActiveTab('list')"
          class="flex items-center gap-2 px-6 py-2.5 rounded-full font-nav-tab transition-all transform cursor-pointer"
          [ngClass]="activeTab === 'list' 
            ? 'bg-gradient-to-r from-list-cyan to-list-teal text-white shadow-md active-tab-glow hover:scale-103' 
            : 'text-on-surface-variant hover:text-primary'"
        >
          <span class="material-symbols-outlined text-[18px]">key</span>
          GENERATED KEYS
        </button>
      </div>
    </div>

    <!-- Content Canvas -->
    <div class="flex-1 min-h-0 w-full flex flex-col">
      <app-key-generator
        *ngIf="activeTab === 'generate'"
        [clients]="clients"
        [keyToEdit]="keyToEdit"
        (onGenerateKey)="handleGenerateKey($event)"
        (onCancelEdit)="handleCancelEdit()"
        class="h-full w-full flex flex-col min-h-0"
      ></app-key-generator>

      <app-key-list
        *ngIf="activeTab === 'list'"
        [generatedKeys]="generatedKeys"
        (onEditKey)="handleEditKey($event)"
        class="h-full w-full flex flex-col min-h-0"
      ></app-key-list>
    </div>
  </main>
</div>

<!-- Alert Notification -->
<app-alert-notification></app-alert-notification>
